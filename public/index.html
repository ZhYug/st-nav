<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="Personal navigation & short links">
  <title>My Navigation</title>
  <link rel="icon" href="/assets/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preload" href="/assets/styles.css?v=1.1.3" as="style">
  <link rel="stylesheet" href="/assets/styles.css?v=1.1.3">
</head>
<body class="public-page">
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
  <header class="topbar shell">
    <a class="brand" href="/">
      <span class="brand-mark">S</span>
      <span><b id="siteTitle">My Navigation</b><small id="siteSubtitle">Personal links</small></span>
    </a>
    <div class="top-actions">
      <button class="icon-btn" id="themeBtn" title="切换主题">☾</button>
      <a class="admin-link" href="/admin">管理</a>
    </div>
  </header>

  <main class="shell public-main">
    <section class="hero">
      <div class="eyebrow">PERSONAL DASHBOARD</div>
      <h1 id="heroTitle">Everything you need, one click away.</h1>
      <p id="heroDesc">A fast, elegant home for your frequently used websites.</p>
      <div class="search-wrap">
        <span>⌕</span><input id="searchInput" autocomplete="off" placeholder="搜索导航、描述或分类…">
        <kbd>⌘ K</kbd>
      </div>
    </section>

    <section class="toolbar">
      <div class="chips" id="categoryChips"></div>
      <button class="text-btn" id="favoritesOnly">☆ 收藏</button>
    </section>

    <section id="navGrid" class="nav-grid" aria-live="polite"></section>
    <nav id="pagination" class="pagination public-pagination" aria-label="首页分页"></nav>
    <div id="emptyState" class="empty-state hidden">
      <div class="empty-icon">⌕</div>
      <h3>没有找到匹配内容</h3>
      <p>换个关键词试试，或者清除筛选。</p>
      <button class="btn secondary" id="clearFilters">清除筛选</button>
    </div>

    <section class="recent-section">
      <div class="section-heading"><div><span class="eyebrow">QUICK ACCESS</span><h2>最近访问</h2></div><button class="text-btn" id="clearRecent">清除</button></div>
      <div id="recentGrid" class="recent-grid"></div>
    </section>
  </main>

  <nav class="mobile-bottom-nav" id="mobileBottomNav" aria-label="移动端快捷导航">
    <button class="mobile-nav-item active" data-mobile-action="home"><span class="mobile-nav-icon">⌂</span><span>首页</span></button>
    <button class="mobile-nav-item" data-mobile-action="favorites"><span class="mobile-nav-icon">☆</span><span>收藏</span></button>
    <button class="mobile-nav-item" data-mobile-action="recent"><span class="mobile-nav-icon">◷</span><span>最近</span></button>
    <button class="mobile-nav-item" data-mobile-action="search"><span class="mobile-nav-icon">⌕</span><span>搜索</span></button>
  </nav>

  <footer class="shell footer">
    <span id="footerText">Personal navigation & short links</span>
    <span>⌘K 快速搜索</span>
  </footer>

  <script src="/assets/common.js?v=1.1.3" defer></script>
  <script src="/assets/app.js?v=1.1.3" defer></script>
</body>
</html>
